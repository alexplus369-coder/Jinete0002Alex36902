<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Contenido IA V2 | Carlos Gonzalez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tab-active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #334155; }

        .tool-btn-active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .tool-btn-inactive { background-color: white; color: #475569; border-color: #e2e8f0; }
        .tool-btn-inactive:hover { border-color: #4f46e5; color: #4f46e5; }

        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-bolt-lightning text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">IA Suite <span class="text-indigo-600">V2</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="config-btn" class="text-slate-500 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-indigo-50">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
            <button class="tool-selector tool-btn-active px-4 py-2 rounded-lg font-medium text-sm border transition-colors flex items-center gap-2 justify-center flex-1 min-w-[150px]" data-target="tool-seo">
                <i class="fa-solid fa-magnifying-glass"></i> Artículos SEO
            </button>
            <button class="tool-selector tool-btn-inactive px-4 py-2 rounded-lg font-medium text-sm border transition-colors flex items-center gap-2 justify-center flex-1 min-w-[150px]" data-target="tool-social">
                <i class="fa-solid fa-share-nodes"></i> Redes Sociales
            </button>
            <button class="tool-selector tool-btn-inactive px-4 py-2 rounded-lg font-medium text-sm border transition-colors flex items-center gap-2 justify-center flex-1 min-w-[150px]" data-target="tool-images">
                <i class="fa-solid fa-image"></i> Prompts Imagen
            </button>
            <button class="tool-selector tool-btn-inactive px-4 py-2 rounded-lg font-medium text-sm border transition-colors flex items-center gap-2 justify-center flex-1 min-w-[150px]" data-target="tool-presentation">
                <i class="fa-solid fa-chalkboard"></i> Guion NotebookLM
            </button>
            <button class="tool-selector tool-btn-inactive px-4 py-2 rounded-lg font-medium text-sm border transition-colors flex items-center gap-2 justify-center flex-1 min-w-[150px]" data-target="tool-analyst">
                <i class="fa-solid fa-brain"></i> Analista NotebookLM
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <div class="lg:col-span-5 space-y-6">
                
                <div id="tool-seo" class="tool-panel bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <form id="generator-form-seo" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Palabra Clave o Título</label>
                            <input type="text" id="seoKeyword" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors">Generar Artículo</button>
                    </form>
                </div>

                <div id="tool-analyst" class="tool-panel hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 h-fit">
                    <form id="generator-form-analyst" class="space-y-5">
                        <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg mb-4">
                            <p class="text-xs text-blue-800 font-medium"><i class="fa-solid fa-microscope text-blue-500 mr-1"></i> Modo Analista: Interpreta textos técnicos complejos con analogías y explicaciones amenas.</p>
                        </div>
                        <div>
                            <label for="analystText" class="block text-sm font-semibold text-slate-700 mb-1">Texto a Analizar</label>
                            <textarea id="analystText" required rows="10" placeholder="Pega aquí el contenido denso..." 
                                      class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
                            Analizar Estilo NotebookLM <i class="fa-solid fa-lightbulb"></i>
                        </button>
                    </form>
                </div>

                </div>

            <div class="lg:col-span-7 h-[calc(100vh-200px)] sticky top-24">
                
                <div id="output-analyst" class="output-panel hidden w-full h-full flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-900 px-4 py-3 flex justify-between items-center text-white">
                        <h3 class="font-bold"><i class="fa-solid fa-wand-magic-sparkles mr-2 text-indigo-400"></i>Análisis e Interpretación</h3>
                        <button class="copy-btn bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm transition-colors" data-source="analyst-result-text">
                            <i class="fa-regular fa-copy mr-1"></i> Copiar
                        </button>
                    </div>
                    <div class="flex-1 overflow-auto p-8 prose max-w-none">
                        <div id="analyst-result-text" class="whitespace-pre-wrap text-slate-800 text-lg leading-relaxed"></div>
                    </div>
                </div>

                </div>
        </div>
    </main>

    <div id="config-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200 mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">Configuración de APIs</h2>
                <button id="close-config" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Google Gemini API Key</label>
                    <input type="password" id="geminiKey" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <button id="save-config" class="w-full mt-6 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-colors">Guardar Configuración</button>
        </div>
    </div>

    <script>
        // Lógica de Navegación entre Herramientas
        const selectors = document.querySelectorAll('.tool-selector');
        const panels = document.querySelectorAll('.tool-panel');
        const outputs = document.querySelectorAll('.output-panel');

        selectors.forEach(selector => {
            selector.addEventListener('click', () => {
                const target = selector.getAttribute('data-target');
                
                selectors.forEach(s => s.classList.replace('tool-btn-active', 'tool-btn-inactive'));
                selector.classList.replace('tool-btn-inactive', 'tool-btn-active');

                panels.forEach(p => p.classList.add('hidden'));
                document.getElementById(target).classList.remove('hidden');

                outputs.forEach(o => o.classList.add('hidden'));
                const outTarget = target.replace('tool-', 'output-');
                if(document.getElementById(outTarget)) document.getElementById(outTarget).classList.remove('hidden');
            });
        });

        // Simulación de Generación (Aquí conectas con tu API de Gemini)
        async function runGeneration(prompt, callback) {
            const apiKey = document.getElementById('geminiKey').value;
            if(!apiKey) { alert("Configura tu API Key primero"); return; }
            
            // Simulación de llamada API
            const resultDiv = document.querySelector('.output-panel:not(.hidden) [id$="-text"]');
            resultDiv.innerHTML = '<div class="loading-shimmer h-64 rounded-lg w-full"></div>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                callback(text);
            } catch (e) {
                resultDiv.innerHTML = "Error al generar contenido. Revisa tu API Key.";
            }
        }

        // --- SUBMIT: ANALISTA NOTEBOOKLM ---
        document.getElementById('generator-form-analyst').addEventListener('submit', async (e) => {
            e.preventDefault();
            const textToAnalyze = document.getElementById('analystText').value;

            const prompt = `
            Actúa como el motor de análisis didáctico de NotebookLM. Tu misión es interpretar el siguiente texto técnico o complejo y explicarlo de forma amena, clara y estructurada.

            Estructura tu respuesta así:
            1. 🎯 SÍNTESIS EN 30 SEGUNDOS: Un párrafo muy directo.
            2. 💡 EL CONCEPTO EXPLICADO CON UNA ANALOGÍA: Usa algo cotidiano (como fútbol, cocina o tecnología simple) para explicar la esencia del texto.
            3. 🧠 DESGLOSE DE PUNTOS CLAVE: Máximo 4 puntos explicados de forma conversacional.
            4. 🚀 ¿QUÉ SIGNIFICA ESTO PARA MÍ?: Conclusión sobre la utilidad práctica.

            IMPORTANTE: Mantén un tono de "tutor inteligente". No uses lenguaje robótico.
            Texto: ${textToAnalyze}`;

            await runGeneration(prompt, (text) => {
                document.getElementById('analyst-result-text').textContent = text;
            });
        });

        // Configuración básica
        document.getElementById('config-btn').onclick = () => document.getElementById('config-modal').classList.remove('hidden');
        document.getElementById('close-config').onclick = () => document.getElementById('config-modal').classList.add('hidden');
        document.getElementById('save-config').onclick = () => {
            localStorage.setItem('gemini_key', document.getElementById('geminiKey').value);
            document.getElementById('config-modal').classList.add('hidden');
        };
        window.onload = () => {
            document.getElementById('geminiKey').value = localStorage.getItem('gemini_key') || '';
        };
    </script>
</body>
</html>
